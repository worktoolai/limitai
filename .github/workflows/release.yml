name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: bun-darwin-arm64
            asset: limitai-macos-arm64
          - runner: macos-latest
            target: bun-darwin-x64
            asset: limitai-macos-x64
          - runner: ubuntu-latest
            target: bun-linux-x64
            asset: limitai-linux-x64
          - runner: ubuntu-latest
            target: bun-linux-arm64
            asset: limitai-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build binary
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.asset }} src/cli.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set tag name
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package.json version
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          PKG_VERSION="v$(jq -r .version package.json)"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          NOTES=""
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..${TAG}" --no-merges | sed 's/^/- /')
            CHANGELOG="**Full Changelog**: [${PREV_TAG}...${TAG}](${REPO_URL}/compare/${PREV_TAG}...${TAG})"
            NOTES="$(printf '%s\n\n%s' "$COMMITS" "$CHANGELOG")"
          fi

          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes "$NOTES"
